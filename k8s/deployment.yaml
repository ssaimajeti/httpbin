apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-service
  namespace: default
  labels:
    app: httpbin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-service
  template:
    metadata:
      labels:
        app: httpbin-service
    spec:
      containers:
        - name: httpbin-service
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: httpbin-service-config
            - secretRef:
                name: httpbin-service-secret
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
